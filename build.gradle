plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'maven-publish'
}

def target = providers.gradleProperty('mcTarget').getOrElse('26.3')
def targetVersions = [
    '1.21.11': [minecraft: '1.21.11', fabricApi: '0.141.4+1.21.11'],
    '26.2'   : [minecraft: '26.2',    fabricApi: '0.154.2+26.2'],
    '26.3'   : [minecraft: '26.3',    fabricApi: '0.161.0+26.3']
]

if (!targetVersions.containsKey(target)) {
    throw new GradleException("Unsupported target '${target}'. Use ${targetVersions.keySet().join(', ')}.")
}

def unobfuscated = target != '1.21.11'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

def versions = targetVersions[target]
def targetJava = unobfuscated ? 25 : 21
version = "${project.mod_version}+mc${versions.minecraft}"
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${versions.minecraft}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'bowalert' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java.srcDir(unobfuscated ? 'src/client26/java' : 'src/client121/java')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${versions.minecraft}"
    // Minecraft 26.x ships unobfuscated and needs no mappings dependency.
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${versions.fabricApi}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${versions.fabricApi}"
    }
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: versions.minecraft,
        java_version: targetJava,
        loader_version: project.loader_version
    ]
    inputs.properties properties
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJava
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
