name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.2"
            java: "25"
          - minecraft: "26.3"
            java: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: ./gradlew build -PmcTarget=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: bow-alert-${{ matrix.minecraft }}
          path: build/libs/bow-alert-${{ matrix.minecraft }}-*.jar
          if-no-files-found: error
